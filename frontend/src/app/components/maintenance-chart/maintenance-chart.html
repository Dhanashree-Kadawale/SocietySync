<div class="chart-card card">
  <div class="card-header">
    <div>
      <h3 class="card-title">Maintenance Collection</h3>
      <p class="chart-subtitle">Monthly collection vs target (₹ Lakhs)</p>
    </div>
    <div class="chart-summary">
      <div class="chart-metric">
        <span class="metric-value">₹18.4L</span>
        <span class="metric-label">This Month</span>
      </div>
      <div class="chart-metric positive">
        <span class="metric-value">+8.2%</span>
        <span class="metric-label">vs Last Month</span>
      </div>
    </div>
  </div>
  <div class="card-body">
    <div class="chart-container">
      <canvas #chartCanvas></canvas>
    </div>
  </div>
</div>
