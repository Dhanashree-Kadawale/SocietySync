<nav class="sidebar" [class.collapsed]="collapsed" [class.mobile-open]="mobileOpen">
  <!-- Logo Area -->
  <div class="sidebar-header">
    <div class="logo-wrap">
      <div class="logo-icon">
        <img src="logo.png" alt="SocietySync Logo" class="brand-logo-img" />
      </div>
      <div class="logo-text" *ngIf="!collapsed">
        <span class="logo-name">SocietySync</span>
        <span class="logo-tagline">SECRETARY PORTAL</span>
      </div>
    </div>
    <button class="collapse-btn" (click)="toggle()" [title]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline *ngIf="!collapsed" points="15 18 9 12 15 6"></polyline>
        <polyline *ngIf="collapsed" points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
  </div>

  <!-- Society & Role Info Pill Card -->
  <div class="society-card" *ngIf="!collapsed">
    <div class="society-card-left">
      <div class="society-home-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
      </div>
      <div class="society-text">
        <span class="society-title">A-204</span>
        <span class="society-sub">Tower A · Greenwood</span>
      </div>
    </div>
    <span class="society-role-badge">Secretary</span>
  </div>

  <div class="society-card-collapsed" *ngIf="collapsed" title="SocietySync · Secretary Portal">
    <div class="society-mini-avatar">
      <img src="logo.png" alt="SocietySync Logo" class="brand-logo-img" />
    </div>
  </div>

  <!-- Navigation Scroll Section -->
  <div class="nav-section">
    <!-- Group 1: MAIN SERVICES -->
    <div class="nav-group-label" *ngIf="!collapsed">MAIN SERVICES</div>
    <ul class="nav-list">
      <li *ngFor="let item of mainServices" class="nav-item" [class.active]="activeRoute === item.id"
        (click)="setActive(item)" [title]="collapsed ? item.label : ''">
        <a class="nav-link" [routerLink]="item.route">
          <span class="nav-icon">
            <ng-container [ngSwitch]="item.icon">
              <!-- Dashboard -->
              <svg *ngSwitchCase="'grid'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <rect x="3" y="3" width="7" height="7" rx="1" />
                <rect x="14" y="3" width="7" height="7" rx="1" />
                <rect x="14" y="14" width="7" height="7" rx="1" />
                <rect x="3" y="14" width="7" height="7" rx="1" />
              </svg>
              <!-- Maintenance Bills -->
              <svg *ngSwitchCase="'credit-card'" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <rect x="1" y="4" width="22" height="16" rx="2" />
                <line x1="1" y1="10" x2="23" y2="10" />
              </svg>
              <!-- Complaints -->
              <svg *ngSwitchCase="'alert-circle'" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
              </svg>
              <!-- Buildings & Flats -->
              <svg *ngSwitchCase="'building'" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <rect x="2" y="3" width="20" height="18" rx="2" />
                <path d="M8 7h2M8 11h2M8 15h2M14 7h2M14 11h2M14 15h2" />
              </svg>
              <!-- Residents -->
              <svg *ngSwitchCase="'users'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
              </svg>
              <!-- Facility Booking -->
              <svg *ngSwitchCase="'calendar'" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <line x1="16" y1="2" x2="16" y2="6" />
                <line x1="8" y1="2" x2="8" y2="6" />
                <line x1="3" y1="10" x2="21" y2="10" />
              </svg>
              <!-- Visitor Management -->
              <svg *ngSwitchCase="'user-check'" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                <circle cx="8.5" cy="7" r="4" />
                <polyline points="17 11 19 13 23 9" />
              </svg>
              <svg *ngSwitchDefault width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <circle cx="12" cy="12" r="10" />
              </svg>
            </ng-container>
          </span>
          <span class="nav-label" *ngIf="!collapsed">{{ item.label }}</span>
          <span class="nav-badge" *ngIf="!collapsed && item.badge">{{ item.badge }}</span>
        </a>
      </li>
    </ul>

    <!-- Group 2: COMMUNITY & ADMIN -->
    <div class="nav-group-label" *ngIf="!collapsed">COMMUNITY</div>
    <ul class="nav-list">
      <li *ngFor="let item of communityItems" class="nav-item" [class.active]="activeRoute === item.id"
        (click)="setActive(item)" [title]="collapsed ? item.label : ''">
        <a class="nav-link" [routerLink]="item.route">
          <span class="nav-icon">
            <ng-container [ngSwitch]="item.icon">
              <!-- Notice Board -->
              <svg *ngSwitchCase="'bell'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                <path d="M13.73 21a2 2 0 0 1-3.46 0" />
              </svg>
              <!-- Documents -->
              <svg *ngSwitchCase="'folder'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
              </svg>
              <!-- Staff -->
              <svg *ngSwitchCase="'briefcase'" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <rect x="2" y="7" width="20" height="14" rx="2" />
                <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2" />
                <line x1="12" y1="12" x2="12" y2="12" />
              </svg>
              <!-- Expenses -->
              <svg *ngSwitchCase="'trending-down'" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <polyline points="23 18 13.5 8.5 8.5 13.5 1 6" />
                <polyline points="17 18 23 18 23 12" />
              </svg>
              <!-- Reports -->
              <svg *ngSwitchCase="'bar-chart-2'" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <line x1="18" y1="20" x2="18" y2="10" />
                <line x1="12" y1="20" x2="12" y2="4" />
                <line x1="6" y1="20" x2="6" y2="14" />
              </svg>
              <!-- Settings -->
              <svg *ngSwitchCase="'settings'" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3" />
                <path
                  d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
              </svg>
              <svg *ngSwitchDefault width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <circle cx="12" cy="12" r="10" />
              </svg>
            </ng-container>
          </span>
          <span class="nav-label" *ngIf="!collapsed">{{ item.label }}</span>
          <span class="nav-badge" *ngIf="!collapsed && item.badge">{{ item.badge }}</span>
        </a>
      </li>
    </ul>

    <!-- Emergency / Gate Contact Card -->
    <div class="security-card" *ngIf="!collapsed">
      <div class="sec-top">
        <span class="sec-dot"></span>
        <span class="sec-title">Security Gate 1</span>
      </div>
      <div class="sec-info">Intercom: <strong>4001</strong> · Mobile: +91 98220 99111</div>
    </div>
  </div>

  <!-- Bottom Profile -->
  <div class="sidebar-footer" *ngIf="!collapsed">
    <div class="admin-profile" (click)="onProfileClick()" style="cursor: pointer;" title="View Society Settings">
      <div class="admin-avatar">RV</div>
      <div class="admin-info">
        <p class="admin-name">Rahul Verma</p>
        <p class="admin-role">Secretary · Green Heights</p>
      </div>
      <button class="admin-action-btn" (click)="$event.stopPropagation(); onSignOut()" title="Sign Out">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="sidebar-footer-collapsed" *ngIf="collapsed" (click)="onProfileClick()" style="cursor: pointer;" title="Rahul Verma (Secretary) - Settings">
    <div class="admin-avatar-sm">RV</div>
  </div>
</nav>
