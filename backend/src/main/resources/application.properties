# ==============================================================================
# SocietySync — Spring Boot Application Configuration
# ==============================================================================

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Spring Application
spring.application.name=societysync-backend

# ------------------------------------------------------------------------------
# Database / DataSource Configuration (MySQL Connector/J)
# Credentials resolved via Environment Variables with safe defaults.
# Never commit plain-text credentials or production secrets.
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:societysync}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=SocietySyncHikariCP
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# ------------------------------------------------------------------------------
# JPA / Hibernate Configuration
# ddl-auto=validate enforces that JPA entities strictly match the
# database schema created and maintained by Flyway migrations.
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# Flyway Database Migration Configuration
# ------------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.table=flyway_schema_history
